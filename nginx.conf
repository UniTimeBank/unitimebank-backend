# ==============================================================================
# Nginx Configuration for UniTime Bank API Gateway & WebSockets
# Đường dẫn cài đặt trên server: /etc/nginx/sites-available/unitimebank.conf
# ==============================================================================

# Giới hạn số lượng request hoặc buffer nếu cần
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

upstream api_gateway_upstream {
    server 127.0.0.1:3000;
    keepalive 64;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.yourdomain.com; # Thay thế bằng domain của bạn hoặc IP của VM

    # Giới hạn kích thước file upload tối đa (ảnh, video, evidence báo cáo)
    client_max_body_size 100M;

    # Nén Gzip tăng tốc độ tải dữ liệu
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # 1. Routing REST API và Root Endpoints
    location / {
        proxy_pass http://api_gateway_upstream;
        proxy_http_version 1.1;

        # Headers forward thông tin client
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts cho các tác vụ dài (như upload file, AI query)
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # 2. Routing WebSocket (Socket.io) cho Notification, Live Room, Whiteboard
    location /socket.io/ {
        proxy_pass http://api_gateway_upstream;
        proxy_http_version 1.1;

        # Bắt buộc cho WebSocket handshake
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket connection timeout (giữ kết nối liên tục không bị ngắt)
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}

# ==============================================================================
# Lưu ý về HTTPS / SSL:
# Sau khi trỏ Domain, chỉ cần chạy lệnh sau để Certbot tự động chèn cấu hình SSL:
# sudo certbot --nginx -d api.yourdomain.com
# ==============================================================================
