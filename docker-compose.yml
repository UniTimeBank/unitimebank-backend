services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: unitimebank_rabbitmq
    ports:
      - '5672:5672'
      - '15672:15672'

  redis:
    image: redis:7-alpine
    container_name: unitimebank_redis
    ports:
      - '6379:6379'

  api-gateway:
    image: node:22-alpine
    container_name: unitimebank_api_gateway
    working_dir: /app
    volumes:
      - .:/app
    command: sh -c "npm install && npx nest start api-gateway --watch"
    environment:
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET}
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      REDIS_URL: redis://redis:6379
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173}
    ports:
      - '3000:3000'
    depends_on:
      - rabbitmq
      - redis

  auth:
    image: node:22-alpine
    container_name: unitimebank_auth
    working_dir: /app
    volumes:
      - .:/app
    command: sh -c "npm install && npx nest start auth --watch"
    environment:
      SERVICE_NAME: auth
      PORT: 3001
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME:-neondb}
      DB_SSL: ${DB_SSL:-true}
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - '3001:3001'
    depends_on:
      - rabbitmq
      - redis

  user:
