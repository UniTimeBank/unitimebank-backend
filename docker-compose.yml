      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME:-neondb}
      DB_SSL: ${DB_SSL:-true}
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      REDIS_URL: redis://redis:6379
    ports:
